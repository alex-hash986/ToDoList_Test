<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6fd">
  <meta name="description" content="Личный список задач с фильтрами и сохранением в браузере.">
  <title>Мои задачи — To-Do List</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body class="min-h-screen text-slate-900 antialiased">
  <main class="mx-auto w-full max-w-[760px] px-4 pt-7 pb-12 sm:px-8 sm:pt-12">
    <header class="flex items-center justify-between gap-3 border-b border-indigo-100 pb-5">
      <div class="flex items-center gap-3">
        <span class="brand-icon grid size-10 place-items-center rounded-xl text-white" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3.5 7 1.7 1.7 3-3.4M12 7h8.5M12 12h8.5M12 17h8.5M4 12h3.5M4 17h3.5"/>
          </svg>
        </span>
        <span class="text-sm font-bold tracking-wide">Список дел</span>
      </div>
      <span class="rounded-full border border-indigo-100 bg-white/80 px-3 py-1 text-xs font-semibold text-indigo-700">To-Do List</span>
    </header>

    <section class="mt-9 mb-7 sm:mt-12 sm:mb-9" aria-labelledby="page-title">
      <p class="mb-3 text-xs font-bold tracking-[0.14em] text-indigo-700 uppercase">Личный список</p>
      <h1 id="page-title" class="text-4xl leading-tight font-bold tracking-tight sm:text-5xl">Мои задачи</h1>
      <p class="mt-3 text-sm leading-relaxed text-slate-600 sm:text-base">Записывайте дела и отмечайте выполненное.</p>
    </section>

    <section class="task-panel overflow-hidden rounded-3xl border border-indigo-100 bg-white" aria-label="Управление задачами">
      <div class="border-b border-slate-100 p-4 sm:p-6">
        <form id="add-form" class="flex flex-wrap gap-2.5">
          <label for="new-task" class="sr-only">Новая задача</label>
          <input id="new-task" class="task-input min-h-12 min-w-0 flex-[1_1_12rem] rounded-xl px-3.5 text-base" type="text" placeholder="Что нужно сделать?" autocomplete="off">
          <button type="submit" class="primary-button inline-flex min-h-12 grow cursor-pointer items-center justify-center gap-2 rounded-xl px-5 text-sm font-semibold text-white sm:grow-0">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Добавить
          </button>
        </form>
        <div id="filters" class="mt-5 inline-flex max-w-full flex-wrap gap-0.5 rounded-xl bg-slate-100 p-1" role="group" aria-label="Фильтры задач">
          <button type="button" class="filter-button" data-filter="all" aria-pressed="true">Все</button>
          <button type="button" class="filter-button" data-filter="active" aria-pressed="false">Активные</button>
          <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Завершенные</button>
        </div>
      </div>

      <ul id="task-list" class="divide-y divide-slate-100 px-4 sm:px-6" aria-label="Задачи" hidden></ul>
      <div id="empty-state" class="grid min-h-61 justify-items-center content-center px-5 py-10 text-center">
        <div class="empty-icon mb-4 grid size-18 place-items-center rounded-2xl text-indigo-600" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="39" height="39" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="5" width="17" height="23" rx="3" fill="white"/>
            <path d="M10.5 11h7.5m-7.5 5h7.5m-7.5 5H14"/>
            <circle cx="23.5" cy="22.5" r="5.5" fill="#e0e7ff"/>
            <path d="m21.3 22.5 1.5 1.5 2.9-3"/>
          </svg>
        </div>
        <p id="empty-title" class="font-semibold">Пока нет задач</p>
        <p id="empty-description" class="mt-1.5 text-sm leading-relaxed text-slate-600">Добавьте первое дело в поле выше.</p>
      </div>

      <footer class="flex min-h-16 flex-wrap items-center justify-between gap-x-4 gap-y-1 border-t border-slate-100 bg-slate-50/70 px-4 py-2 sm:px-6">
        <p id="remaining" class="text-sm font-semibold text-slate-600" role="status">Осталось: 0</p>
        <button id="clear-completed" type="button" class="min-h-11 cursor-pointer rounded-lg px-2 text-sm font-semibold text-indigo-700 transition-colors hover:bg-indigo-50" hidden>Очистить выполненные</button>
      </footer>
    </section>

    <p id="storage-status" class="mt-3 rounded-xl bg-amber-50 px-4 py-3 text-sm text-amber-900" role="status" hidden></p>
    <p class="mt-5 flex items-center justify-center gap-2 text-center text-xs text-slate-600">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v1"/>
      </svg>
      Задачи хранятся в этом браузере
    </p>
    <noscript><p class="mt-4 text-center text-sm text-red-700">Включите JavaScript, чтобы управлять задачами.</p></noscript>
  </main>

  <template id="task-template">
    <li class="flex items-start gap-2 py-3 sm:gap-3">
      <label class="grid size-11 shrink-0 cursor-pointer place-items-center">
        <input type="checkbox" class="task-check size-5 cursor-pointer accent-indigo-600">
      </label>
      <span class="task-text min-w-0 flex-1 py-2.5 leading-6 text-slate-800"></span>
      <button type="button" class="icon-button edit-button" title="Редактировать задачу" aria-label="Редактировать задачу">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 6 3 3M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/>
        </svg>
      </button>
      <button type="button" class="icon-button delete-button" title="Удалить задачу" aria-label="Удалить задачу">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16m-10 4v6m4-6v6M9 7V4h6v3M6 7l1 13h10l1-13"/>
        </svg>
      </button>
    </li>
  </template>

  <template id="editor-template">
    <form class="flex min-w-0 flex-1 flex-wrap items-center gap-2">
      <input type="text" class="task-input min-h-11 min-w-0 flex-[1_1_10rem] rounded-xl px-3 text-base" aria-label="Текст задачи" autocomplete="off">
      <button type="submit" class="primary-button min-h-11 cursor-pointer rounded-xl px-3 text-sm font-semibold text-white">Сохранить</button>
      <button type="button" class="cancel-button min-h-11 cursor-pointer rounded-xl px-3 text-sm font-semibold text-slate-600 transition-colors hover:bg-slate-100">Отмена</button>
    </form>
  </template>
</body>
</html>
